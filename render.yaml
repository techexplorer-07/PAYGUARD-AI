# Render Blueprint for the PAYGUARD AI backend (FastAPI).
# Render dashboard -> New -> Blueprint -> select this repository.
services:
  - type: web
    name: payguard-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Single worker on purpose: the SPEG evidence graph and model are held in process memory.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      # Hide internal exception details from API error responses.
      - key: DEBUG
        value: "false"
      # Set to the live frontend address after the Vercel deploy, e.g. https://payguard-ai.vercel.app
      - key: CORS_EXTRA_ORIGINS
        sync: false
      # Optional: allow this project's Vercel preview deployments.
      - key: CORS_ORIGIN_REGEX
        sync: false
